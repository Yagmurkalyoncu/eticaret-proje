<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sipariş Ver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        header { background: #2c3e50; color: white; padding: 15px 30px; }
        header h1 { font-size: 24px; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .form-kart { background: white; border-radius: 10px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { font-size: 24px; color: #2c3e50; margin-bottom: 20px; }
        .urun-bilgi { background: #f8f8f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .fiyat { font-size: 24px; font-weight: bold; color: #e74c3c; }
        .form-grup { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #c0392b; }
        .geri { display: inline-block; margin-bottom: 20px; color: #2c3e50; text-decoration: none; }
    </style>
</head>
<body>
    <header><h1>🛒 E-Ticaret Mağazası</h1></header>
    <div class="container">
        <a href="/urun/{{ urun.pk }}/" class="geri">← Geri Dön</a>
        <div class="form-kart">
            <h2>Sipariş Ver</h2>
            <div class="urun-bilgi">
                <strong>{{ urun.ad }}</strong>
                <div class="fiyat">₺{{ urun.fiyat }}</div>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="form-grup">
                    <label>Adınız Soyadınız</label>
                    <input type="text" name="ad" required placeholder="Ad Soyad">
                </div>
                <div class="form-grup">
                    <label>E-posta</label>
                    <input type="email" name="email" required placeholder="email@example.com">
                </div>
                <div class="form-grup">
                    <label>Miktar</label>
                    <input type="number" name="miktar" value="1" min="1" max="{{ urun.stok }}">
                </div>
                <button type="submit" class="btn">Siparişi Tamamla</button>
            </form>
        </div>
    </div>
</body>
</html>
