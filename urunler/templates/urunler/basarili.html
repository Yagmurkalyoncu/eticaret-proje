<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sipariş Başarılı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        header { background: #2c3e50; color: white; padding: 15px 30px; }
        header h1 { font-size: 24px; }
        .container { max-width: 600px; margin: 80px auto; padding: 0 20px; text-align: center; }
        .basarili-kart { background: white; border-radius: 10px; padding: 50px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .icon { font-size: 60px; margin-bottom: 20px; }
        h2 { font-size: 28px; color: #27ae60; margin-bottom: 15px; }
        p { color: #666; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 12px 30px; background: #2c3e50; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <header><h1>🛒 E-Ticaret Mağazası</h1></header>
    <div class="container">
        <div class="basarili-kart">
            <div class="icon">✅</div>
            <h2>Siparişiniz Alındı!</h2>
            <p>Siparişiniz başarıyla oluşturuldu. En kısa sürede size ulaşacağız.</p>
            <a href="/" class="btn">Alışverişe Devam Et</a>
        </div>
    </div>
</body>
</html>
