<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{{ urun.ad }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        header { background: #2c3e50; color: white; padding: 15px 30px; }
        header h1 { font-size: 24px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .urun-detay { background: white; border-radius: 10px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { font-size: 28px; color: #2c3e50; margin-bottom: 15px; }
        .fiyat { font-size: 32px; font-weight: bold; color: #e74c3c; margin: 15px 0; }
        .aciklama { color: #666; line-height: 1.6; margin-bottom: 20px; }
        .stok { color: #27ae60; margin-bottom: 20px; }
        .geri { display: inline-block; margin-bottom: 20px; color: #2c3e50; text-decoration: none; }
        .btn { display: inline-block; padding: 12px 30px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <header><h1>🛒 E-Ticaret Mağazası</h1></header>
    <div class="container">
        <a href="/" class="geri">← Geri Dön</a>
        <div class="urun-detay">
            <h2>{{ urun.ad }}</h2>
            <div class="fiyat">₺{{ urun.fiyat }}</div>
            <p class="aciklama">{{ urun.aciklama }}</p>
            <p class="stok">✓ Stokta {{ urun.stok }} adet var</p>
            <a href="/siparis/{{ urun.pk }}/" class="btn">Sipariş Ver</a>
        </div>
    </div>
</body>
</html>
